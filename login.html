<!doctype html>
<html lang="en" data-auth="guest">
<head>
<meta charset="utf-8">
<!-- Security policy: scripts may only come from this site (no inline or injected scripts); styles and fonts only from this site and Google Fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEFF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C111D" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Log in · Study Planner</title>
<meta name="description" content="Log in to Study Planner to see your tasks, weekly schedule, study plans and flashcards.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="js/auth.js"></script>
</head>
<body>
<main class="auth-page">
  <section class="panel auth-card" aria-labelledby="login-title">
    <p class="auth-brand">Study Planner</p>
    <h1 id="login-title">Log in</h1>
    <p class="muted-note" id="login-reason">Welcome back. Log in to see your plan.</p>

    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" aria-describedby="email-error">
        <p class="field-error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" aria-describedby="password-error">
        <p class="field-error" id="password-error" aria-live="polite"></p>
      </div>

      <label class="check">
        <input type="checkbox" id="remember"> Keep me logged in
      </label>

      <p class="form-error" role="alert"></p>
      <button class="btn btn-full" type="submit">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
  </section>
  <p class="auth-foot"><a href="contact.html">Contact us</a> · Your account is stored in this browser only.</p>
</main>
<script src="js/validate.js"></script>
<script src="js/login.js"></script>
</body>
</html>
