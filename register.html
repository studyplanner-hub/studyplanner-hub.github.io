<!doctype html>
<html lang="en" data-auth="guest">
<head>
<meta charset="utf-8">
<!-- Security policy: scripts may only come from this site (no inline or injected scripts); styles and fonts only from this site and Google Fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEFF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C111D" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Create account · Study Planner</title>
<meta name="description" content="Create a free Study Planner account to plan your studies, track tasks and exams, and build study plans for over 50 university subjects.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="js/auth.js"></script>
</head>
<body>
<main class="auth-page">
  <section class="panel auth-card" aria-labelledby="register-title">
    <p class="auth-brand">Study Planner</p>
    <h1 id="register-title">Create your account</h1>
    <p class="muted-note">Plan your week, track tasks and review flashcards.</p>

    <form id="register-form" class="auth-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-error">
        <p class="field-error" id="name-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" aria-describedby="email-error">
        <p class="field-error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" aria-describedby="password-hint password-error">
        <p class="field-hint" id="password-hint">At least 8 characters, with a letter and a number.</p>
        <p class="field-error" id="password-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" aria-describedby="confirm-error">
        <p class="field-error" id="confirm-error" aria-live="polite"></p>
      </div>

      <label class="check">
        <input type="checkbox" id="show-password"> Show passwords
      </label>

      <p class="form-error" role="alert"></p>
      <button class="btn btn-full" type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </section>
  <p class="auth-foot"><a href="contact.html">Contact us</a> · Your account is stored in this browser only.</p>
</main>
<script src="js/validate.js"></script>
<script src="js/register.js"></script>
</body>
</html>
